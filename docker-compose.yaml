services:
  shinyproxy:
    image: openanalytics/shinyproxy
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shinyproxy/application.yml:/opt/shinyproxy/application.yml
    restart: unless-stopped
    networks:
      - sp-net

  data-fetcher:
    build: 
      context: ./cron
    platform: linux/amd64
    volumes:
      - ./Data:/app/Data
    restart: unless-stopped
    networks:
      - sp-net

  shiny-app-1:
    build: 
      context: ./shiny-app-1
    image: sll-shiny-app-1:latest
    platform: linux/amd64
    profiles:
      - build
    networks:
      - sp-net

  shiny-app-2:
    build: 
      context: ./shiny-app-2
    image: sll-shiny-app-2:latest
    platform: linux/amd64
    profiles:
      - build
    networks:
      - sp-net

  shiny-app-3:
    build: 
      context: ./shiny-app-3
    image: sll-shiny-app-3:latest
    platform: linux/amd64
    profiles:
      - build
    networks:
      - sp-net

  shiny-app-4:
      build: ./shiny-app-4
      image: sll-shiny-app-4:latest
      platform: linux/amd64
      profiles:
      - build
      networks:
        - sp-net

networks:
  sp-net:
    name: sp-net