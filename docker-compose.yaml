services:
  shinyproxy:
    image: openanalytics/shinyproxy
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shinyproxy/application.yml:/opt/shinyproxy/application.yml
    restart: unless-stopped
    networks:
      - sp-net

  data-fetcher:
    build: ./cron
    platform: linux/amd64
    volumes:
      - ./Data:/app/Data
    restart: unless-stopped
    networks:
      - sp-net

  shiny-app-1:
    build: ./shiny-app-1
    platform: linux/amd64
    volumes:
      - ./Data:/srv/shiny-server/Data
    restart: unless-stopped
    container-sharing:
        enabled: true
        max-clients: 5
    container-backend-spec:
        pre-initialization:
          enabled: true
          min-instances: 2
    networks:
      - sp-net

  shiny-app-2:
    build: ./shiny-app-2
    platform: linux/amd64
    volumes:
      - ./Data:/srv/shiny-server/Data
    restart: unless-stopped
    networks:
      - sp-net

  shiny-app-3:
    build: ./shiny-app-3
    platform: linux/amd64
    volumes:
      - ./Data:/app/Data
    restart: unless-stopped
    networks:
      - sp-net

  shiny-app-4:
      build: ./shiny-app-4
      platform: linux/amd64
      volumes:
        - ./Data:/app/Data
      restart: unless-stopped
      networks:
        - sp-net

networks:
  sp-net:
    name: sp-net